<!doctype html>
<html><head><meta charset="utf-8"><title>SunrootLearn: 2-minute film</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a1a52;font-family:'Inter','DM Sans',system-ui,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.blob{border-radius:50%;filter:blur(60px);background:rgba(120,170,255,.32)}
.h1{width:980px;left:50px;text-align:center;color:#fff;font-weight:900;letter-spacing:-.02em;line-height:1.02;text-shadow:0 6px 30px rgba(5,15,70,.45)}
.sub{width:900px;left:90px;text-align:center;color:#dbe7ff;font-weight:600;font-size:46px}
.chip{z-index:6;display:flex;align-items:center;gap:18px;padding:22px 34px;background:#fff;border-radius:28px;color:#0f1d4d;font-weight:800;font-size:44px;box-shadow:0 14px 40px rgba(5,15,70,.35);white-space:nowrap}
.chip i{display:block;width:52px;height:52px;border-radius:14px;background:#3b6df6}
.chip.out{background:#eaf0ff}
.card{background:#fff;border-radius:44px;box-shadow:0 30px 80px rgba(3,10,50,.5);color:#0f1d4d}
#phone{width:760px;height:1645px;border-radius:64px;border:14px solid #0b1230;background:#0b1230;overflow:hidden;box-shadow:0 40px 90px rgba(3,10,50,.55)}
#phone .scr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#sheet{position:absolute;left:0;top:758px;width:760px;height:887px}
.ring{border-radius:50%;border:10px solid rgba(255,255,255,.6)}
#caps{left:70px;width:940px;top:1600px;text-align:center;z-index:30}
#caps span{display:inline-block;padding:14px 30px;border-radius:26px;background:rgba(6,16,64,.72);color:#fff;font-weight:800;font-size:52px;line-height:1.22}
#caps b{color:#9ec0ff;font-weight:800}#caps b.on{color:#fff}
.badge{display:flex;align-items:center;gap:16px;padding:20px 34px;border-radius:999px;background:#fff;color:#0f1d4d;font-weight:900;font-size:48px;box-shadow:0 14px 40px rgba(5,15,70,.35);white-space:nowrap}
.w{display:inline-block;margin:0 .1em}
.tile{width:150px;height:170px;border-radius:30px;background:#fff;color:#1740c4;font-weight:900;font-size:110px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(5,15,70,.35)}
.row{display:flex;align-items:center;gap:20px;padding:26px 32px;border-radius:26px;font-weight:800;font-size:40px}
.av{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:62px;color:#fff;border:8px solid #fff;box-shadow:0 12px 30px rgba(5,15,70,.35)}
#confetti{position:absolute;left:0;top:0;z-index:20;pointer-events:none}
</style></head>
<body><div id="stage">
<div class="abs" id="bg" style="width:1080px;height:1920px;left:0;top:0"></div>
<div class="abs blob" id="b1" style="width:700px;height:700px"></div>
<div class="abs blob" id="b2" style="width:600px;height:600px"></div>
<div class="abs ring" id="ringA" style="width:300px;height:300px"></div>
<div class="abs ring" id="ringB" style="width:300px;height:300px"></div>
<div class="abs h1" id="hl"></div>
<div class="abs sub" id="sb"></div>
<img class="abs" id="logo" src="assets/logo.svg" style="background:#fff;border-radius:70px;padding:30px 50px;width:700px;z-index:5">

<!-- M3 night desk -->
<div id="nd"><div class="abs card" id="clock" style="width:640px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1230;color:#9ec0ff;border:6px solid #2b3d8f"><div id="clk" style="font-size:150px;font-weight:900;color:#fff;letter-spacing:.02em">11:00</div><div style="font-size:44px;font-weight:700">PM · test at 9 AM</div></div>
<div class="abs badge" id="pgs" style="background:#fbbf24;color:#3b2200">40 pages to read</div></div>
<!-- M4 cram -->
<div class="abs card" id="cram" style="width:820px;height:820px;padding:50px;overflow:hidden"><div id="cramtxt" style="font-size:44px;line-height:1.55;font-weight:600"></div><div id="cramhl" style="position:absolute;left:30px;width:760px;height:62px;background:rgba(59,109,246,.28);border-radius:14px"></div></div>
<div class="abs badge" id="reads">Read it again: 1</div>
<!-- M5 forgetting -->
<div class="abs card" id="forget" style="width:900px;height:560px;padding:50px;font-size:50px;font-weight:700;line-height:1.5"></div>
<div class="abs badge" id="when" style="background:#0b1230;color:#fff">Tonight</div>
<!-- M6 tower -->
<div class="abs" id="tower" style="width:700px;height:900px"></div>

<!-- phone -->
<div class="abs chip" id="f1"><i></i>Lecture notes</div><div class="abs chip" id="f2"><i style="background:#f97316"></i>Slides</div><div class="abs chip" id="f3"><i style="background:#14b8a6"></i>Photo of the board</div>
<div class="abs chip out" id="o1">Lessons</div><div class="abs chip out" id="o2">Flashcards</div><div class="abs chip out" id="o3">Quizzes</div>
<div class="abs" id="phone"><img class="scr" id="img1" src="assets/phone-lesson.png"><div class="abs ring" id="tap" style="width:90px;height:90px;border-color:#3b6df6;border-width:8px;opacity:0"></div><img id="sheet" src="assets/popup-sheet.png" style="opacity:0"></div>

<!-- M9/M10 lab -->
<div class="abs card" id="lab" style="width:900px;height:1030px;background:#0e1a4d;border:6px solid #2b4fd0;overflow:hidden">
  <canvas id="labc" width="900" height="760" style="position:absolute;left:0;top:0"></canvas>
  <div id="labtag" style="position:absolute;left:30px;top:24px;padding:10px 22px;border-radius:999px;background:#3b6df6;color:#fff;font-weight:800;font-size:34px">LIVE 3D LAB</div>
  <div style="position:absolute;left:40px;top:790px;width:820px;color:#cfe0ff;font-weight:700;font-size:36px" id="labctl"></div>
</div>
<div class="abs" id="dots" style="display:flex;gap:16px"><i style="width:22px;height:22px;border-radius:50%;background:#fff;opacity:.4"></i><i style="width:22px;height:22px;border-radius:50%;background:#fff;opacity:.4"></i><i style="width:22px;height:22px;border-radius:50%;background:#fff;opacity:.4"></i></div>
<!-- M11 formula -->
<div id="fm"><div class="abs tile" id="t0">F</div><div class="abs tile" id="t1" style="background:transparent;color:#fff;box-shadow:none">=</div><div class="abs tile" id="t2">m</div><div class="abs tile" id="t3" style="background:transparent;color:#fff;box-shadow:none">×</div><div class="abs tile" id="t4">a</div>
<div class="abs" id="steps" style="width:760px"></div><svg class="abs" id="mring" width="360" height="360" viewBox="0 0 360 360"><circle cx="180" cy="180" r="150" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="26"/><circle id="mringp" cx="180" cy="180" r="150" fill="none" stroke="#fbbf24" stroke-width="26" stroke-linecap="round" transform="rotate(-90 180 180)" stroke-dasharray="942" stroke-dashoffset="942"/></svg><div class="abs badge" id="mast" style="background:#fbbf24;color:#3b2200">Mastered</div></div>
<!-- M12 map -->
<svg class="abs" id="map" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0"></svg>
<!-- M13 study -->
<div id="st"><div class="abs av" id="a0" style="background:#14b8a6">A</div><div class="abs av" id="a1" style="background:#8b5cf6">K</div><div class="abs av" id="a2" style="background:#f97316">T</div><div class="abs av" id="a3" style="background:#ec4899">M</div>
<div class="abs card" id="timer" style="width:560px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div id="tmr" style="font-size:130px;font-weight:900;color:#1740c4">10:00</div><div style="font-size:38px;font-weight:700;color:#475569">focus sprint</div></div>
<div class="abs badge" id="live" style="background:#ef4444;color:#fff">LIVE SESSION</div><div class="abs badge" id="bub">Got it!</div></div>
<!-- M14 compare -->
<div class="abs card" id="cmp" style="width:960px;height:700px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:start;background:#f1f5ff"></div>
<!-- end -->
<div class="abs h1" id="cta" style="font-size:80px;top:1010px"></div>
<div class="abs chip" id="btn" style="background:#3b6df6;color:#fff;font-size:64px;padding:30px 70px;border-radius:999px;border:6px solid #fff">Start free today</div>
<div class="abs sub" id="url" style="font-size:52px;font-weight:800;color:#fff"></div>
<div class="abs" id="sprout" style="width:400px;height:430px;z-index:8"></div>
<canvas id="confetti" width="1080" height="1920"></canvas>
<div class="abs" id="caps"><span></span></div>
</div>
<script src="sprout.js"></script>
<script>
const CFG = Object.assign({ url: 'sunrootlearn.vercel.app' }, window.CONFIG || {});
const TL = window.TIMELINE; const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const place = (el, x, y, s = 1, r = 0, o = 1) => { el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`; el.style.opacity = o; };
const setText = (el, s) => { if (el._t !== s) { el._t = s; el.innerHTML = s; } };
const L = TL.lines, TOTAL = TL.total;
const A = (i) => L[i - 1].start, B = (i) => L[i - 1].start + L[i - 1].dur;   // line i (1-based): start and end
let CUR_T = 0;
const spr = createSprout($('sprout')), sprEl = $('sprout');

function kinetic(el, words, t0, y, size) {
  const key = words.join('|') + size;
  if (el._w !== key) { el._w = key; el.innerHTML = words.map((w) => `<span style="display:inline-block;margin:0 .13em;will-change:transform">${w}</span>`).join(''); }
  [...el.children].forEach((c, i) => { const k = prog(CUR_T, t0 + i * .09, t0 + i * .09 + .45); c.style.transform = `translateY(${(1 - back(k)) * 110}px) scale(${.6 + .4 * back(k)})`; c.style.opacity = clamp(k * 3); });
  el.style.top = y + 'px'; el.style.fontSize = size + 'px'; el.style.opacity = 1;
}
function sub(txt, t0, y) { const k = eo(prog(CUR_T, t0, t0 + .6)); const e = $('sb'); setText(e, txt); e.style.top = y + 'px'; e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 40}px)`; }

// confetti
const cv = $('confetti'), cx = cv.getContext('2d');
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const COLS = ['#ffffff', '#9ec0ff', '#3b6df6', '#14b8a6', '#fbbf24', '#ffffff', '#60a5fa'];
function mkBurst(seed, n, ox, oy, spread) { const r = mulberry(seed); const ps = []; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (r() - .5) * spread; const v = 700 + r() * 1100; ps.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 14 + r() * 18, h: 8 + r() * 12, c: COLS[(r() * COLS.length) | 0], rot: r() * 6, vr: (r() - .5) * 14, ox, oy }); } return ps; }
const BURSTS = [{ t: 0.3, ps: mkBurst(1, 120, 540, 1000, 2.6) }, { t: 0.5, ps: mkBurst(2, 60, 120, 1500, 1.4) }, { t: 0.5, ps: mkBurst(3, 60, 960, 1500, 1.4) },
  { t: B(11) - 1.2, ps: mkBurst(7, 60, 540, 1000, 2.4) },   // mastered
  { t: A(16) + .1, ps: mkBurst(4, 140, 540, 1250, 2.8) }, { t: A(16) + .4, ps: mkBurst(5, 80, 100, 1500, 1.4) }, { t: A(16) + .4, ps: mkBurst(6, 80, 980, 1500, 1.4) }];
function drawConfetti(t) { cx.clearRect(0, 0, 1080, 1920); for (const b of BURSTS) { const u = t - b.t; if (u < 0 || u > 4) continue; for (const p of b.ps) { const d = Math.exp(-u * 1.6); const x = p.ox + p.vx * (1 - d) / 1.6, y = p.oy + p.vy * (1 - d) / 1.6 + 350 * u * u; cx.save(); cx.translate(x, y); cx.rotate(p.rot + p.vr * u); cx.globalAlpha = clamp((4 - u) / 1.2); cx.scale(1, Math.cos(u * 9 + p.rot)); cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cx.restore(); } } }

// ---------- 3D lab (real perspective-ish projection, rotating camera) ----------
const lc = $('labc').getContext('2d');
function proj(x, y, z, yaw, sc) { const c = Math.cos(yaw), s = Math.sin(yaw); const rx = x * c - y * s, ry = x * s + y * c; return [450 + rx * sc, 400 + ry * sc * .5 - z * sc * .9, ry]; }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const r = Math.min(255, ((n >> 16) & 255) * k), g = Math.min(255, ((n >> 8) & 255) * k), b = Math.min(255, (n & 255) * k); return `rgb(${r | 0},${g | 0},${b | 0})`; }
function poly(pts, fill) { lc.beginPath(); pts.forEach((p, i) => (i ? lc.lineTo(p[0], p[1]) : lc.moveTo(p[0], p[1]))); lc.closePath(); lc.fillStyle = fill; lc.fill(); }
function box(x, y, z0, w, d, h, ang, col, yaw, sc) {
  const ca = Math.cos(ang), sa = Math.sin(ang); const fp = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([a, b]) => [x + a * ca - b * sa, y + a * sa + b * ca]);
  const bot = fp.map(([a, b]) => proj(a, b, z0, yaw, sc)), top = fp.map(([a, b]) => proj(a, b, z0 + h, yaw, sc));
  const faces = [0, 1, 2, 3].map((i) => { const j = (i + 1) % 4; return { p: [bot[i], bot[j], top[j], top[i]], d: (bot[i][2] + bot[j][2]) / 2, k: .62 + .22 * Math.cos(ang + i * Math.PI / 2 - yaw + .7) }; }).sort((a, b) => a.d - b.d);
  faces.forEach((f) => poly(f.p, shade(col, f.k))); poly(top, shade(col, 1.12));
}
function trackPt(u) { // rounded rectangle loop, half sizes 3.4 x 2.2
  const a = 3.4, b = 2.2, r = 1.2; const per = 2 * (2 * (a - r) + 2 * (b - r)) + 2 * Math.PI * r; let s = ((u % 1) + 1) % 1 * per;
  const segs = [[2 * (a - r)], [Math.PI * r / 2], [2 * (b - r)], [Math.PI * r / 2], [2 * (a - r)], [Math.PI * r / 2], [2 * (b - r)], [Math.PI * r / 2]];
  const P = [[-(a - r), -b, 1, 0], [a - r, -b, 0, 0], [a, -(b - r), 0, 1], [a, b - r, 0, 0], [a - r, b, -1, 0], [-(a - r), b, 0, 0], [-a, b - r, 0, -1], [-a, -(b - r), 0, 0]];
  // straight, arc, straight, arc ...
  const parts = [{ t: 'l', x0: -(a - r), y0: -b, x1: a - r, y1: -b }, { t: 'a', cx: a - r, cy: -(b - r), a0: -Math.PI / 2, a1: 0 }, { t: 'l', x0: a, y0: -(b - r), x1: a, y1: b - r }, { t: 'a', cx: a - r, cy: b - r, a0: 0, a1: Math.PI / 2 }, { t: 'l', x0: a - r, y0: b, x1: -(a - r), y1: b }, { t: 'a', cx: -(a - r), cy: b - r, a0: Math.PI / 2, a1: Math.PI }, { t: 'l', x0: -a, y0: b - r, x1: -a, y1: -(b - r) }, { t: 'a', cx: -(a - r), cy: -(b - r), a0: Math.PI, a1: 1.5 * Math.PI }];
  for (const p of parts) { const len = p.t === 'l' ? Math.hypot(p.x1 - p.x0, p.y1 - p.y0) : Math.PI * r / 2; if (s <= len) { const k = s / len; if (p.t === 'l') return { x: lerp(p.x0, p.x1, k), y: lerp(p.y0, p.y1, k), h: Math.atan2(p.y1 - p.y0, p.x1 - p.x0) }; const an = lerp(p.a0, p.a1, k); return { x: p.cx + r * Math.cos(an), y: p.cy + r * Math.sin(an), h: an + Math.PI / 2 }; } s -= len; }
  return { x: 0, y: 0, h: 0 };
}
let carU = 0, carT = -1;
function drawLab(t, u) {
  lc.clearRect(0, 0, 900, 760);
  const g = lc.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, '#0e1a4d'); g.addColorStop(1, '#16296e'); lc.fillStyle = g; lc.fillRect(0, 0, 900, 760);
  const yaw = .55 + .5 * Math.sin(u * .55), sc = 92;
  // floor grid
  for (let i = -5; i < 5; i++) for (let j = -4; j < 4; j++) poly([proj(i, j, 0, yaw, sc), proj(i + 1, j, 0, yaw, sc), proj(i + 1, j + 1, 0, yaw, sc), proj(i, j + 1, 0, yaw, sc)], (i + j) & 1 ? '#1d3b9c' : '#234ab8');
  // track
  const N = 90, L1 = [], R1 = []; for (let k = 0; k <= N; k++) { const q = trackPt(k / N), n = [-Math.sin(q.h), Math.cos(q.h)]; L1.push(proj(q.x + n[0] * .38, q.y + n[1] * .38, .01, yaw, sc)); R1.push(proj(q.x - n[0] * .38, q.y - n[1] * .38, .01, yaw, sc)); }
  poly([...L1, ...R1.reverse()], '#0b1230');
  lc.setLineDash([14, 14]); lc.strokeStyle = '#e2e8f0'; lc.lineWidth = 3; lc.beginPath(); for (let k = 0; k <= N; k++) { const q = trackPt(k / N), p = proj(q.x, q.y, .02, yaw, sc); k ? lc.lineTo(p[0], p[1]) : lc.moveTo(p[0], p[1]); } lc.stroke(); lc.setLineDash([]);
  // speed set by the slider (0.3 -> 0.9 over the scene)
  const sp = lerp(.35, .95, eio(prog(u, 2.2, 4.8)));
  if (carT < 0 || u < carT) carU = 0; if (carT >= 0) carU += (u - carT) * sp * .07; carT = u;
  const c = trackPt(carU);
  // objects sorted by depth
  const objs = [];
  [[-2.2, -.2, '#14b8a6'], [1.3, 0.1, '#8b5cf6'], [.2, -1.2, '#f97316']].forEach(([x, y, col]) => objs.push({ d: proj(x, y, 0, yaw, sc)[2], f: () => box(x, y, 0, .7, .7, .7, .3, col, yaw, sc) }));
  const hd = c.h; objs.push({ d: proj(c.x, c.y, 0, yaw, sc)[2], f: () => {
    box(c.x, c.y, 0.16, 1.0, .55, .24, hd, '#3b6df6', yaw, sc); box(c.x - .08 * Math.cos(hd), c.y - .08 * Math.sin(hd), .4, .45, .42, .22, hd, '#e8efff', yaw, sc);
    [[.32, .3], [.32, -.3], [-.32, .3], [-.32, -.3]].forEach(([a, b]) => box(c.x + a * Math.cos(hd) - b * Math.sin(hd), c.y + a * Math.sin(hd) + b * Math.cos(hd), 0, .26, .1, .26, hd, '#0f172a', yaw, sc));
    // sensor beams
    const fx = c.x + .6 * Math.cos(hd), fy = c.y + .6 * Math.sin(hd); const a = proj(fx, fy, .2, yaw, sc), b = proj(fx + .5 * Math.cos(hd), fy + .5 * Math.sin(hd), 0, yaw, sc);
    lc.strokeStyle = '#ef4444'; lc.lineWidth = 4; lc.beginPath(); lc.moveTo(a[0], a[1]); lc.lineTo(b[0], b[1]); lc.stroke(); lc.fillStyle = '#ef4444'; lc.beginPath(); lc.arc(b[0], b[1], 7, 0, 7); lc.fill();
  } });
  objs.sort((a, b) => a.d - b.d).forEach((o) => o.f());
  // HUD in the lab card
  const knob = lerp(.3, .9, eio(prog(u, 2.2, 4.8))); const spd = (knob * 2).toFixed(1);
  setText($('labctl'), `<div style="display:flex;align-items:center;gap:20px;margin-bottom:18px"><span style="width:150px">Speed</span><div style="flex:1;height:16px;border-radius:8px;background:#2b3d8f;position:relative"><div style="width:${knob * 100}%;height:100%;border-radius:8px;background:#3b6df6"></div><div style="position:absolute;left:${knob * 100}%;top:-12px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)"></div></div><span style="width:150px;text-align:right;color:#fff">${spd} m/s</span></div><svg width="820" height="120" viewBox="0 0 820 120">${(() => { let d = ''; for (let k = 0; k <= 80; k++) { const x = k * 10.25, tt = u - (80 - k) * .06; const v = lerp(.35, .95, eio(prog(tt, 2.2, 4.8))); d += (k ? 'L' : 'M') + x + ' ' + (110 - v * 100 + 4 * Math.sin(tt * 6)); } return `<path d="${d}" stroke="#7fb0ff" stroke-width="5" fill="none"/>`; })()}</svg>`.replace(/\s{2,}/g, ' '));
