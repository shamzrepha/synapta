<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunroot — Official Pitch & Product Demo Video (1080p)</title>
  <style>
    :root {
      --bg: #FAF6EE;
      --card: #FFFFFF;
      --ink: #1B2E22;
      --muted: #5A655E;
      --forest: #2E5E3E;
      --amber: #D97724;
      --border: #E4DBC8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(155deg, #FCF9F2 0%, #F4EBDC 100%);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 48px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(252, 249, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 18px;
      color: var(--forest);
      text-decoration: none;
    }
    .brand span.pill {
      background: #EBF3ED;
      color: var(--forest);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: var(--amber);
      color: #FFF;
      box-shadow: 0 6px 18px rgba(217, 119, 36, 0.28);
    }
    .btn-forest {
      background: var(--forest);
      color: #FFF;
      box-shadow: 0 6px 18px rgba(46, 94, 62, 0.22);
    }
    .btn-outline {
      background: #FFF;
      color: var(--ink);
      border-color: var(--border);
    }
    .container {
      max-width: 1180px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .video-shell {
      background: #142219;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(20, 34, 25, 0.22);
      border: 2px solid #2E5E3E;
      position: relative;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      background: #0f1a13;
    }
    .now-playing {
      padding: 14px 20px;
      background: #182C20;
      color: #FFF;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .now-playing .scene-title {
      font-weight: 700;
      font-size: 15px;
      color: #FDE68A;
    }
    .now-playing .scene-sub {
      font-size: 13px;
      color: #C8DFD0;
      margin-top: 2px;
    }
    .chapters-title {
      margin: 26px 0 12px;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--forest);
    }
    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 12px;
    }
    .chapter-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chapter-card:hover {
      border-color: var(--amber);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(27, 46, 34, 0.08);
    }
    .chapter-card.active {
      border-color: var(--amber);
      background: #FEF7EC;
      box-shadow: 0 10px 26px rgba(217, 119, 36, 0.15);
    }
    .chapter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      color: var(--forest);
    }
    .chapter-card.active .chapter-top { color: var(--amber); }
    .chapter-name {
      font-weight: 800;
      font-size: 15px;
      color: var(--ink);
    }
    .chapter-text {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
    }
    @media (max-width: 640px) {
      header { padding: 10px 14px; }
      .btn { padding: 8px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/pitch/index.html" class="brand">
      🌱 Sunroot Pitch Demo
      <span class="pill">1080p HD + Studio Voiceover</span>
    </a>
    <div class="actions">
      <a class="btn btn-primary" href="/pitch/Sunroot-Pitch-Demo.mp4" download="Sunroot-Pitch-Demo.mp4">
        ⬇ Download .MP4 Video
      </a>
      <a class="btn btn-forest" href="/pitch/index.html">
        ✨ Interactive Slide Deck
      </a>
      <a class="btn btn-outline" href="/pitch/Sunroot-Pitch-Deck-Animated.pptx" download="Sunroot-Pitch-Deck-Animated.pptx">
        📊 Download .PPTX
      </a>
    </div>
  </header>

  <main class="container">
    <div class="video-shell">
      <video id="demoVideo" controls playsinline preload="metadata" poster="/pitch/video-poster.png">
        <source src="/pitch/Sunroot-Pitch-Demo.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>
      <div class="now-playing">
        <div>
          <div class="scene-title" id="activeSceneTitle">01 · Introducing Sunroot — Understand it. Build it. Prove it.</div>
          <div class="scene-sub" id="activeSceneSub">Tap Play above or jump to any of the 8 pitch chapters below.</div>
        </div>
        <button class="btn btn-primary" id="playPauseBtn" type="button">▶ Play Pitch Video</button>
      </div>
    </div>

    <div class="chapters-title">Jump to Scene (8-Part Narrated Pitch & Product Demo)</div>
    <div class="chapters-grid" id="chaptersGrid"></div>
  </main>

  <script>
    const CHAPTERS = [
      { id: 1, start: 0.1, end: 8.95, timeLabel: "0:00", title: "01 · Introducing Sunroot", text: "Meet Sunroot — turning passive STEM cramming into hands-on mastery, on any phone, in every learner's language." },
      { id: 2, start: 8.95, end: 23.90, timeLabel: "0:09", title: "02 · The Problem", text: "Why millions of STEM students pass written exams on topics they can't actually use in the lab." },
      { id: 3, start: 23.90, end: 39.50, timeLabel: "0:24", title: "03 · Teacher AI Pipeline", text: "Upload a syllabus and AI generates notes, a 2-host podcast, a simulation & 60+ quiz items. Teacher reviews first." },
      { id: 4, start: 39.50, end: 54.26, timeLabel: "0:39", title: "04 · Way 1: Read & Listen (8 Languages)", text: "Two-voice conversational podcast in English, Naijá Pidgin, Yorùbá, Igbo, Hausa, French, Arabic & Swahili." },
      { id: 5, start: 54.26, end: 69.53, timeLabel: "0:54", title: "05 · Ways 2 & 3: Simulate & Practice", text: "Real-time interactive circuit sliders (120 mA Target Hit) + FSRS spaced repetition & adaptive quizzes." },
      { id: 6, start: 69.53, end: 84.25, timeLabel: "1:09", title: "06 · Way 4: Prove It (3D Digital Twin)", text: "Wire real components, program microcontroller logic, and test your build in a 3D robot digital twin." },
      { id: 7, start: 84.25, end: 95.97, timeLabel: "1:24", title: "07 · For Educators: BKT Mastery Radar", text: "Bayesian Knowledge Tracing heatmap spots which student is stuck weeks before final exams." },
      { id: 8, start: 95.97, end: 110.2, timeLabel: "1:36", title: "08 · Built & Live Today", text: "Backed by 3,900+ automated tests. Live today on web and mobile at sunrootlearn.vercel.app." }
    ];

    const video = document.getElementById('demoVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const activeSceneTitle = document.getElementById('activeSceneTitle');
    const activeSceneSub = document.getElementById('activeSceneSub');
    const grid = document.getElementById('chaptersGrid');

    CHAPTERS.forEach((ch, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chapter-card' + (idx === 0 ? ' active' : '');
      btn.dataset.idx = idx;
      btn.innerHTML = `
        <div class="chapter-top">
          <span>SCENE 0${ch.id}</span>
          <span>▶ ${ch.timeLabel}</span>
        </div>
        <div class="chapter-name">${ch.title.replace(/^0\d · /, '')}</div>
        <div class="chapter-text">${ch.text}</div>
      `;
      btn.addEventListener('click', () => {
        video.currentTime = ch.start;
        video.play();
      });
      grid.appendChild(btn);
    });

    playPauseBtn.addEventListener('click', () => {
      if (video.paused) video.play();
      else video.pause();
    });

    video.addEventListener('play', () => { playPauseBtn.textContent = '⏸ Pause Video'; });
    video.addEventListener('pause', () => { playPauseBtn.textContent = '▶ Play Pitch Video'; });

    video.addEventListener('timeupdate', () => {
      const t = video.currentTime;
      let activeIdx = 0;
      for (let i = 0; i < CHAPTERS.length; i++) {
        if (t >= CHAPTERS[i].start) activeIdx = i;
      }
      const ch = CHAPTERS[activeIdx];
      activeSceneTitle.textContent = ch.title;
      activeSceneSub.textContent = ch.text;
      document.querySelectorAll('.chapter-card').forEach((el, idx) => {
        el.classList.toggle('active', idx === activeIdx);
      });
    });
  </script>
</body>
</html>
